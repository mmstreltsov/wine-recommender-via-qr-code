# Dev-профиль: значения postgres — локальные dev-учётные данные (не секреты).
# Prod-значения передаются только через env (см. .env.example), не коммитятся.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: svoyshef
      POSTGRES_PASSWORD: svoyshef
      POSTGRES_DB: svoyshef
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svoyshef -d svoyshef"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
